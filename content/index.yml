seo:
  title: Moonlight
  description: Modern Minecraft software for Legacy communities.
title: "Modern Software\nFor Legacy communities"
description: Get the legacy experience you know and love without giving up on modern features and security patches.
hero:
  headline: "Selenium now released"
  links:
    - label: Downloads
      color: primary
      size: xl
      icon: mdi:download
      to: 'downloads'
    - label: Documentation
      color: neutral
      size: xl
      icon: mdi:book
      variant: soft
      to: 'https://docs.moonlightpowered.com'
terminal:
  lines:
    - segments:
        - text: "$ "
          style: prompt
        - text: "npx telemetry"
          style: cmd
        - text: " init"
          style: flag
    - segments:
        - text: "→ Scanning service topology..."
          style: dim
    - segments:
        - text: "→ Found "
          style: dim
        - text: "23 services"
          style: cmd
        - text: ", "
          style: dim
        - text: "847 endpoints"
          style: cmd
        - text: ", "
          style: dim
        - text: "12 databases"
          style: cmd
    - segments:
        - text: "→ Deploying collector agents "
          style: dim
        - text: "✓"
          style: success
    - segments:
        - text: "→ Baseline established in "
          style: dim
        - text: "340ms"
          style: metric-good
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "✓ Live at "
          style: success
        - text: "https://app.example.com/acme-corp"
          style: url
logos:
  title: Trusted by engineering teams at
  items:
    - i-simple-icons-vercel
    - i-simple-icons-github
    - i-simple-icons-linear
    - i-simple-icons-supabase
    - i-simple-icons-stripe
feeling:
  headline: Legacy Combat
  title: "Same feeling on legacy clients"
  description: Stay up-to-date on supported versions without giving up on legacy combat mechanics.
infrastructure:
  headline: Modern Infrastructure
  title: "No more outdated software"
  description: Secure your servers with modern forwarding or make use of modern object components.
metrics:
  headline: By the numbers
  title: "Built for scale you haven't hit yet."
  description: Process billions of events per day across thousands of production environments with an architecture designed for the workloads of 2030.
  items:
    - value: "99.99%"
      label: Uptime SLA
      class: "text-success"
    - value: "<50ms"
      label: P99 query
      class: "text-primary"
    - value: "14B+"
      label: Events / day
      class: "text-info"
    - value: "4 min"
      label: Early warning
      class: "text-warning"
cta:
  title: "Ready to stop\nfirefighting?"
  description: Free for up to 5 services. No credit card. Deploys in under a minute.
  command: npx telemetry init
  links:
    - label: Start for free
      color: primary
      to: '#'
